name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v2
      
      - name: Update theme
        run: git submodule update --init --recursive

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.71.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v1
        with:
          node-version: '12.x'

      # - name: Cache dependencies
      #  uses: actions/cache@v1
      #  with:
      #    path: ~/.npm
      #    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      #    restore-keys: |
      #      ${{ runner.os }}-node-

        - name: Cache
          uses: actions/cache@v5.0.5
          with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path:  ~/.npm
          # An explicit key for restoring and saving the cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
          restore-keys: |
             ${{ runner.os }}-node-
          # The chunk size used to split up large files during upload, in bytes
          upload-chunk-size: # optional
          # An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
          enableCrossOsArchive: # optional, default is false
          # Fail the workflow if cache entry is not found
          fail-on-cache-miss: # optional, default is false
          # Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
          lookup-only: # optional, default is false
          # Run the post step to save the cache even if another step before fails
          save-always: # optional, default is false
          

      - run: npm ci
      - run: hugo --minify
        
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: foreverphoenix/foreverphoenix.github.io
          publish_dir: ./public
          user_name: foreverphoenix
          user_email: admin@thephoenixflavour.com
          publish_branch: master
          cname: thephoenixflavour.com
      
      # - name: Purge cache
      #  uses: jakejarvis/cloudflare-purge-action@master
      #  env:
      #    CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
      #    # CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      #    CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      #    CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}


      - name: Cloudflare Cache Cleaner
        uses: Cyb3r-Jak3/action-cloudflare-cache@v1.1.0
        with:
              zone: ${{ secrets.CLOUDFLARE_ZONE }}
              email: ${{ secrets.CLOUDFLARE_EMAIL }}
              global_token: ${{ secrets.CLOUDFLARE_KEY }}

